<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Intelligence Curator - Job Matches</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.1?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "brand-dark": "#03045e",
                        "brand-medium": "#00b4d8",
                        "brand-light": "hsl(222, 100%, 98%)",
                        "background": "hsl(222, 100%, 98%)",
                        "primary": "hsl(227.95, 100%, 48.82%)",
                        "secondary": "#00b4d8"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"]
                    }
                },
            },
            plugins: [
                function ({ addComponents }) {
                    addComponents({
                        '.material-symbols-outlined': {
                            'font-variation-settings': "'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24",
                        },
                        '.glass-card': {
                            'background': 'hsla(228, 100%, 90.9%, 0.7)',
                            'backdrop-filter': 'blur(20px)',
                            'border': '1px solid rgba(3, 4, 94, 0.1)',
                        },
                        '.recommended-job-card': {
                            'position': 'relative',
                            'display': 'flex',
                            'align-items': 'flex-start',
                            'gap': '1.25rem',
                            'padding': '1.5rem',
                            'background-color': '#DBE3FF',
                            'color': '#03045e',
                            'border-radius': '1.25rem',
                            'border': '1px solid rgba(3, 4, 94, 0.05)',
                            'transition': 'all 0.3s',
                            '&:hover': {
                                'transform': 'scale(1.01)',
                            },
                        },
                        '.company-branding-initials': {
                            'width': '4rem',
                            'height': '4rem',
                            'border-radius': '0.75rem',
                            'background-color': '#03045e',
                            'color': 'hsl(222, 100%, 98%)',
                            'display': 'flex',
                            'align-items': 'center',
                            'justify-content': 'center',
                            'font-weight': '800',
                            'font-size': '1.5rem',
                            'flex-shrink': 0,
                        },
                        '.job-application-btn': {
                            'background-color': 'hsl(227.95, 100%, 48.82%)',
                            'color': '#ffffff',
                            'border': '2px solid hsl(227.95, 100%, 48.82%)',
                            'padding': '0.625rem 2rem',
                            'border-radius': '9999px',
                            'font-weight': '700',
                            'font-size': '0.875rem',
                            'transition': 'all 0.2s',
                            '&:hover': {
                                'background-color': '#ffffff',
                                'color': 'hsl(227.95, 100%, 48.82%)',
                                'border-color': 'hsl(227.95, 100%, 48.82%)',
                            },
                            '&:active': {
                                'background-color': '#ffffff',
                                'color': 'hsl(227.95, 100%, 48.82%)',
                                'transform': 'scale(0.97)',
                            },
                        },
                        '.ai-match-velocity-pill': {
                            'padding': '0.25rem 0.75rem',
                            'background-color': '#03045e',
                            'color': '#caf0f8',
                            'border-radius': '9999px',
                            'display': 'flex',
                            'align-items': 'center',
                            'gap': '0.375rem',
                            'font-size': '0.75rem',
                            'font-weight': '700',
                        },
                        '@keyframes slideFromRight': {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        '@keyframes slideFromLeft': {
                            '0%': { transform: 'translateX(-100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        '.slide-from-right': {
                            'animation': 'slideFromRight 1.5s cubic-bezier(0.16, 1, 0.3, 1) both',
                        },
                        '.slide-from-left': {
                            'animation': 'slideFromLeft 1.5s cubic-bezier(0.16, 1, 0.3, 1) both',
                        }
                    })
                }
            ]
        }
    </script>
    <style>
        :root {
            --bg-primary: #EDF2FB;
            --bg-white: #FFFFFF;
            --surface: #F1F5F9;
            --border: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --accent-light: #DBEAFE;
            --accent-soft: #EFF6FF;
            --radius-full: 999px;
        }

        .navbar {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2.5rem);
            max-width: 1200px;
            z-index: 1000;
            padding: 0 2rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-full);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--accent-light);
            border-radius: var(--radius-full);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .nav-btn-active {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* --- LOADING OVERLAY --- */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(237, 242, 251, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            /* Visible by default while loading */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(37, 99, 235, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            color: var(--brand-dark);
            font-size: 1.25rem;
            letter-spacing: -0.02em;
        }
    </style>
    <script>
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY > 50;
            document.querySelector(".navbar").classList.toggle("scrolled", scrolled);
        });
    </script>
    <!-- Shared Transitions -->
    <link rel="stylesheet" href="/assets/transitions.css">
    <script src="/assets/transitions.js"></script>
</head>

<body class="bg-brand-light font-body text-brand-dark overflow-x-hidden">
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text">Scouting live job matches from global platforms...</p>
    </div>

    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="/" class="logo" id="logo">
                <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="8" fill="#2563EB" />
                    <path d="M8 10.5C8 9.67 8.67 9 9.5 9H18.5C19.33 9 20 9.67 20 10.5V11H8V10.5Z" fill="white" />
                    <rect x="7" y="12" width="14" height="8" rx="1.5" fill="white" fill-opacity="0.9" />
                    <path d="M12 12V14.5C12 14.78 12.22 15 12.5 15H15.5C15.78 15 16 14.78 16 14.5V12" stroke="#2563EB"
                        stroke-width="1.2" />
                </svg>
                <span>JobPilot</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/resume_page/resume.html" class="nav-btn">Resume</a>
                <a href="/analysis_page/analysis.html" class="nav-btn">Analysis</a>
                <a href="job_page.html" class="nav-btn nav-btn-active">Job</a>
            </div>
        </div>
    </nav>
    <main class="min-h-screen pt-32 pb-16 px-8 max-w-5xl mx-auto">
        <h1 class="font-headline text-5xl font-extrabold tracking-tighter mb-12">Curated Matches</h1>
        <div id="jobs-container" class="space-y-6">
            <!-- Dynamic Job Feeds will be injected here -->
            <div class="p-12 text-center opacity-50">
                Searching for roles that match your profile...
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            gsap.registerPlugin(ScrollTrigger);

            const loadingOverlay = document.getElementById('loading-overlay');
            const jobsContainer = document.getElementById('jobs-container');
            const data = JSON.parse(localStorage.getItem('career_analysis'));

            if (!data) {
                loadingOverlay.style.display = 'none';
                jobsContainer.innerHTML = '<div class="p-12 text-center opacity-50">No career profile found. Please upload your resume first.</div>';
                return;
            }

            // --- Platform Logo Mapping ---
            const logoMap = {
                'Indeed': '/Indeed_logo.svg',
                'Glassdoor': '/Glassdoor_logo.svg',
                'Naukri': '/Naukri.svg',
                'Upwork': '/Upwork-logo.svg',
                'FoundIt': '/foundit logo.png',
                'Internshala': '/internshala_og_image.jpg'
            };

            try {
                const response = await fetch('/api/scout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roles: data.user_inputs.roles,
                        locations: data.user_inputs.locations,
                        experience: data.user_inputs.experience,
                        opportunity_type: data.user_inputs.opportunity_type
                    })
                });

                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    console.error('Failed to parse scout response:', responseText);
                }

                if (!response.ok) {
                    throw new Error(result?.error || `Server Error: ${response.status}`);
                }

                if (result.success && result.jobs.length > 0) {
                    // 2. Render Job Cards
                    jobsContainer.innerHTML = result.jobs.map(job => `
                        <div class="recommended-job-card shadow-sm hover:shadow-md transition-shadow">
                            <div class="company-branding-initials bg-white p-2">
                                <img src="${logoMap[job.platform] || '../Indeed_logo.svg'}" class="w-full h-full object-contain" alt="${job.platform}">
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <h2 class="text-2xl font-bold font-headline">${job.title}</h2>
                                        <p class="font-bold opacity-70">${job.platform} • Active Feed • AI Curated</p>
                                    </div>
                                    <div class="ai-match-velocity-pill">
                                        <span class="material-symbols-outlined text-xs">bolt</span>
                                        TOP MATCH
                                    </div>
                                </div>
                                <p class="mb-6 font-medium text-brand-dark/80">${job.snippet}</p>
                                <div class="flex gap-4">
                                    <a href="${job.link}" target="_blank" class="job-application-btn no-underline inline-block text-center" style="text-decoration: none;">
                                        Browse Postings
                                    </a>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // 3. Trigger Animations
                    gsap.utils.toArray(".recommended-job-card").forEach((card, i) => {
                        gsap.from(card, {
                            scrollTrigger: {
                                trigger: card,
                                start: "top 90%",
                                toggleActions: "play none none none"
                            },
                            y: 30,
                            opacity: 0,
                            duration: 0.6,
                            ease: "power2.out",
                            delay: i * 0.1
                        });
                    });
                } else {
                    jobsContainer.innerHTML = '<div class="p-12 text-center opacity-50">No jobs found for your criteria. Try adjusting your preferences.</div>';
                }
            } catch (error) {
                console.error('Scouting failed:', error);
                jobsContainer.innerHTML = '<div class="p-12 text-center text-red-600">Error connection to scouting engine. Please check if your backend is running.</div>';
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });
    </script>
</body>

</html>
